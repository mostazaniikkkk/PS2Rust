[workspace]
resolver = "2"
members = ["crates/ps2", "examples/hello", "examples/selftest", "examples/cube", "examples/panic", "examples/std-hello", "examples/std-selftest", "examples/std-panic"]
exclude = ["toolchain"]

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
panic = "abort"
